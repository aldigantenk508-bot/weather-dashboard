<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Get real-time weather information for any location</p>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Enter city name..."
                    autocomplete="off"
                >
                <button id="searchBtn" onclick="searchWeather()">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div id="suggestions" class="suggestions"></div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <!-- Error Message -->
        <div id="error" class="error hidden"></div>

        <!-- Current Weather -->
        <div id="currentWeather" class="current-weather hidden">
            <div class="weather-card">
                <div class="city-info">
                    <h2 id="cityName"></h2>
                    <p id="dateTime"></p>
                </div>
                <div class="weather-main">
                    <div class="weather-icon">
                        <img id="weatherIcon" src="" alt="Weather Icon">
                    </div>
                    <div class="temperature-info">
                        <div class="temperature">
                            <span id="temperature"></span>
                            <span class="unit">°C</span>
                        </div>
                        <p id="description"></p>
                    </div>
                </div>
                <div class="weather-details">
                    <div class="detail-item">
                        <i class="fas fa-droplet"></i>
                        <div>
                            <p>Humidity</p>
                            <span id="humidity"></span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-wind"></i>
                        <div>
                            <p>Wind Speed</p>
                            <span id="windSpeed"></span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-compress"></i>
                        <div>
                            <p>Pressure</p>
                            <span id="pressure"></span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-eye"></i>
                        <div>
                            <p>Visibility</p>
                            <span id="visibility"></span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-gauge"></i>
                        <div>
                            <p>Feels Like</p>
                            <span id="feelsLike"></span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-sun"></i>
                        <div>
                            <p>UV Index</p>
                            <span id="uvIndex"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5-Day Forecast -->
        <div id="forecast" class="forecast hidden">
            <h3>5-Day Forecast</h3>
            <div class="forecast-cards" id="forecastCards"></div>
        </div>

        <!-- Hourly Forecast -->
        <div id="hourly" class="hourly hidden">
            <h3>Hourly Forecast (Next 24 Hours)</h3>
            <div class="hourly-cards" id="hourlyCards"></div>
        </div>

        <!-- Recent Searches -->
        <div class="recent-searches">
            <h3>Recent Searches</h3>
            <div id="recentList" class="recent-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
